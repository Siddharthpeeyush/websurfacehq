[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websurfacehq-api"
version = "0.1.0"
description = "WebSurfaceHQ API — vulnerability-scanner SaaS backend (Phase 0 skeleton)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
