# WebSurfaceHQ pre-commit hooks.
#
# Install (developer machine — pre-commit is NOT installed on the build VM):
#   pip install pre-commit
#   pre-commit install
# Run on demand:  pre-commit run --all-files
#
# Revs are pinned to specific releases so every developer runs the same hooks.

repos:
  # Generic file hygiene (pre-commit-hooks v4.6.0)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # Python lint + format (ruff pre-commit mirror, v0.17.4)
  # Rev matches the ruff pin in apps/api/requirements.txt (ruff==0.17.4)
  # so local hooks and CI lint the same way. Verified tag via GitHub API.
  # Runs in apps/api; the repo-root config picks up apps/api/pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # JS/TS/Markdown format (prettier mirror, v3.1.0)
  # NOTE: the mirrors-prettier repo's newest stable tag is v3.1.0
  # (verified via GitHub API 11 Nov 2026 — v3.3.3/v3.6.2 do not exist
  # as tags there). The rev below is the MIRROR's hook version, not the
  # prettier version: `additional_dependencies` pins the prettier that
  # actually runs, and it MUST match apps/web/package.json (prettier
  # 3.10.0) or the hook and `npm` reformat each other's output.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.10.0

  # Secret scan on every commit (gitleaks v8.30.1) — catches a secret before
  # it reaches the remote, instead of only at CI push-time.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
